# Verdandi Windows (M1 .. M3): the first runnable build (norns window, matron and Lua, sclang and scsynth on a null audio device). plan: docs/port/phase-m1.md, guide: windows/README.md.
# builds SuperCollider 3.14.1 (with Verdandi's null audio driver patch), builds norns.exe and the launcher with MSYS2, assembles the folder, starts it HEADLESS on the runner and checks the logs and a
# screenshot, and uploads the zip. every step records PASS or FAIL in a report (windows/ci/lib.sh); the artifact "verdandi-windows-m1" holds the zip, the report, the logs of the test run and its screenshot.
name: windows-m1

on:
  push:
    branches: [linux-port, windows-port]
    paths:
      - 'windows/**'
      - 'matron/**'
      - 'norns/**'
      - 'crone/**'
      - 'lua/**'
      - 'sc/**'
      - '.github/workflows/windows-m1.yml'
  workflow_dispatch:
    inputs:
      runner:
        description: 'Runner image'
        type: choice
        default: windows-2022
        options:
          - windows-2022
          - windows-latest

permissions:
  contents: read

# a newer push replaces the run in progress on the same branch (the runs are long and expensive)
concurrency:
  group: windows-m1-${{ github.ref }}
  cancel-in-progress: true

env:
  NONBLOCKING_CHECKS: ''
  SC_TAG: Version-3.14.1
  M0_REQUIRE: 'sc norns assemble m1'
  TAIL_LINES: '130'

jobs:
  sc:
    name: SuperCollider 3.14.1 (MSVC, with the null audio driver)
    runs-on: ${{ inputs.runner || 'windows-2022' }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Build SuperCollider
        env:
          JOBS: '4'
        run: windows/ci/build-sc.sh
      - name: What failed
        if: always()
        run: windows/ci/show-failures.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m1-out-sc
          path: m0-out
          retention-days: 14
          if-no-files-found: warn

  norns:
    name: norns.exe and Verdandi.exe (MSYS2 UCRT64)
    runs-on: ${{ inputs.runner || 'windows-2022' }}
    timeout-minutes: 60
    defaults:
      run:
        shell: msys2 {0}
    steps:
      # third-party/ (doctest, link, ...) and crone/softcut are git submodules
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: git base-devel
      - name: Dependencies (packages, Lua 5.3, libmonome)
        timeout-minutes: 30
        env:
          DEPS_STEPS: 'packages lua libmonome'
        run: windows/ci/msys2-deps.sh
      - name: Build norns.exe and the launcher
        timeout-minutes: 30
        run: windows/ci/build-norns.sh
      - name: What failed
        if: always()
        run: windows/ci/show-failures.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m1-out-norns
          path: m0-out
          retention-days: 14
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m1-norns-bin
          path: m1-norns
          retention-days: 14
          if-no-files-found: warn

  # M6: maiden for Windows (cross-built on Linux: Go and static web files) and the portable tools (MinGit, busybox). Not fatal for the other jobs: the package then lacks them and its M6 checks say so
  # M7: SuperCollider plug-in packs for Windows (the whole sc3-plugins collection, mi-UGens, NamAmp when NAMAMP_URL is set): built per directory with `ninja -k 0`, so that what compiles is shipped and what does not is
  # listed in the report (m7-report.txt). NOT blocking: without this job the zip is built as before, without the packs.
  plugins:
    name: SuperCollider plug-in packs (sc3-plugins, mi-UGens, NamAmp)
    runs-on: ${{ inputs.runner || 'windows-2022' }}
    timeout-minutes: 90
    continue-on-error: true
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Build the packs
        env:
          NAMAMP_URL: ${{ vars.NAMAMP_URL }}
        run: windows/ci/build-sc3plugins.sh
      - name: The report
        if: always()
        run: cat m7-out/m7-report.txt || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m7-plugins
          path: m7-out
          retention-days: 14
          if-no-files-found: warn

  maiden:
    name: maiden for Windows (Go server and web app)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Build maiden
        run: OUT="$PWD/maiden-win" B="$RUNNER_TEMP/maiden-build" windows/ci/build-maiden.sh
      - uses: actions/upload-artifact@v4
        with:
          name: m6-maiden
          path: maiden-win
          retention-days: 14
          if-no-files-found: error

  tools:
    name: portable tools (MinGit, busybox)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the tools
        env:
          GH_TOKEN: ${{ github.token }}
        run: OUT="$PWD/tools-win" windows/ci/fetch-tools.sh
      - uses: actions/upload-artifact@v4
        with:
          name: m6-tools
          path: tools-win
          retention-days: 14
          if-no-files-found: error

  # M3/M31: PortAudio with the ASIO host API (MSYS2, from source with Steinberg's SDK under its GPLv3 option: docs/port/asio-licence.md). THE zip is the ASIO build (docs/port/phase-m31.md): when this job
  # fails there is no new zip, nothing is published, and windows-latest keeps the last good one.
  asio:
    name: PortAudio with ASIO (MSYS2 UCRT64)
    runs-on: ${{ inputs.runner || 'windows-2022' }}
    timeout-minutes: 20
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: git base-devel mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-cmake mingw-w64-ucrt-x86_64-ninja
      - name: Build PortAudio with ASIO
        run: windows/ci/build-portaudio-asio.sh
      - name: What failed
        if: always()
        run: windows/ci/show-failures.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m3-out-asio
          path: m0-out
          retention-days: 14
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m3-asio-dll
          path: m3-asio
          retention-days: 14
          if-no-files-found: warn

  # M31: ONE zip. it is assembled once (this job) and checked by two jobs at the same time on the same file: the long checks of the program (package, the limits of M2 to M22) and the cases with the stub ASIO
  # driver (package-asio, the limits of M30). the release job publishes only a zip that both passed.
  assemble:
    name: Assemble the one zip
    needs: [sc, norns, asio, maiden, tools, plugins]
    if: ${{ always() && needs.sc.result == 'success' && needs.norns.result == 'success' && needs.asio.result == 'success' }}
    runs-on: ${{ inputs.runner || 'windows-2022' }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: m1-out-sc
          path: sc-artifact
      - uses: actions/download-artifact@v4
        with:
          name: m1-norns-bin
          path: m1-norns
      - uses: actions/download-artifact@v4
        with:
          name: m3-asio-dll
          path: m3-asio
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: m6-maiden
          path: m6-maiden
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: m6-tools
          path: m6-tools
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: m7-plugins
          path: m7-plugins
      - name: The ASIO DLL must exist
        run: test -f m3-asio/libportaudio-2.dll || { echo "the ASIO build of PortAudio did not make libportaudio-2.dll (see the job 'PortAudio with ASIO' and its step log)"; ls -l m3-asio; exit 1; }
      - name: Assemble the folder and the zip
        run: PLUGINS_DIR="$PWD/m7-plugins" MAIDEN_DIR="$PWD/m6-maiden" TOOLS_DIR="$PWD/m6-tools" ASIO_DIR="$PWD/m3-asio" NORNS_BIN="$PWD/m1-norns" SC_ZIP="$PWD/sc-artifact/sc-win64.zip" windows/ci/assemble-m1.sh
      - name: What failed
        if: always()
        run: windows/ci/show-failures.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m1-out-assemble
          path: m0-out
          retention-days: 14
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m1-zip
          path: m1-stage/Verdandi-windows-latest.zip
          retention-days: 30
          if-no-files-found: warn

  package:
    name: Start it headless and check (everything but the ASIO cases)
    needs: [assemble]
    if: ${{ always() && needs.assemble.result == 'success' }}
    runs-on: ${{ inputs.runner || 'windows-2022' }}
    timeout-minutes: 110
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: m1-zip
          path: m1-stage
      - name: Start it headless and check
        timeout-minutes: 100
        run: ZIP="$PWD/m1-stage/Verdandi-windows-latest.zip" WORK="$RUNNER_TEMP/m1" SMOKE_SECONDS=90 SMOKE_PART=main windows/ci/smoke-m1.sh
      - name: What failed
        if: always()
        run: windows/ci/show-failures.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m1-out-package
          path: m0-out
          retention-days: 14
          if-no-files-found: warn

  package-asio:
    name: 'ASIO cases (no driver, a driver, busy, will not start, vanishes) on the same zip'
    needs: [assemble]
    if: ${{ always() && needs.assemble.result == 'success' }}
    runs-on: ${{ inputs.runner || 'windows-2022' }}
    timeout-minutes: 90   # M30: the limits of the ASIO job stay
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: m1-zip
          path: m1-stage
      - name: Start it headless and check (the ASIO cases with the stub driver)
        timeout-minutes: 75   # M30: was 30. the headless check took 23 min on 0.10.16 and ran into the limit on 0.10.18 (25cb7da): every check was then "not found" and the zip was not published
        run: ZIP="$PWD/m1-stage/Verdandi-windows-latest.zip" WORK="$RUNNER_TEMP/m3" SMOKE_SECONDS=60 SMOKE_CYCLES=3 SMOKE_PART=asio windows/ci/smoke-m1.sh
      - name: What failed
        if: always()
        run: windows/ci/show-failures.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m1-out-asio
          path: m0-out
          retention-days: 14
          if-no-files-found: warn

  # a successful run on linux-port publishes its zip to GitHub Releases: windows-<short hash> for every commit (kept: the newest 20) and windows-latest (replaced each time, only when no check failed).
  # the workflow's own token, the one permission this job needs: contents: write (create and delete releases and their tags). nothing else in the workflow gets write access.
  release:
    name: Publish the zip to GitHub Releases
    needs: [assemble, package, package-asio, report]
    if: ${{ always() && github.ref == 'refs/heads/linux-port' && needs.assemble.result == 'success' && needs.package.result == 'success' && needs.package-asio.result == 'success' && needs.report.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: windows-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: m1-zip
          path: release-zip
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: verdandi-windows-m1
          path: release-report
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          ZIP_DIR: release-zip
          STATUS_DIR: release-report/status
        run: windows/ci/publish-release.sh

  report:
    name: Report and artifact
    needs: [sc, norns, assemble, package, package-asio]
    if: always()
    runs-on: ${{ inputs.runner || 'windows-2022' }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: m1-out-*
          path: m0-out
          merge-multiple: true
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: m1-zip
          path: dist
      - name: Report
        env:
          M0_RUN: "run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} | commit ${{ github.sha }} | runner ${{ inputs.runner || 'windows-2022' }} (${{ runner.os }} ${{ runner.arch }})"
        run: |
          windows/ci/report.sh | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Assemble the artifact
        if: always()
        run: |
          mkdir -p dist
          cp -r m0-out/M0-REPORT.md dist/M1-REPORT.md 2> /dev/null || true
          cp -r m0-out/logs m0-out/status m0-out/m1-run dist/ 2> /dev/null || true
          cp windows/pack/README-M1.txt dist/README.txt
          find dist -maxdepth 2 | head -40
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verdandi-windows-m1
          path: dist
          retention-days: 30
