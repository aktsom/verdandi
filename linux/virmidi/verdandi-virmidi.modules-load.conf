# Verdandi: load the kernel's virtual MIDI card at boot, so that Reaper (which reads raw ALSA MIDI only) has a MIDI input that Verdandi out can feed.
# opt-in: copy this file to /etc/modules-load.d/verdandi-virmidi.conf (as admin) and, to get one port in Reaper's list instead of four, also
# verdandi-virmidi.modprobe.conf to /etc/modprobe.d/verdandi-virmidi.conf. the package never installs anything into /etc by itself.
snd-virmidi
